<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Random Password Generator</title>
    <!-- GOOGLE ICONS -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=file_copy" />
    <link rel="icon" href="./lock.png" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="password-container">
      <h1>Random Password Generator</h1>

      <div class="input-container">
        <input
          type="text"
          id="input"
          class="input"
          placeholder="Creat Password"
          readonly />
        <span class="material-symbols-outlined"> file_copy </span>
      </div>
      <button class="btn">Generate</button>
    </div>
    <div class="alert-container active">Passward Copied</div>
    <script src="app.js"></script>
  </body>
</html>
